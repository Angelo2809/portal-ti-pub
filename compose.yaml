services:
  portal-ti:
    build: .
    environment:
      DB_DRIVER: sqlite
      PORTAL_DB_PATH: /app/data/demo.sqlite
      DEMO_MODE: "true"
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${PORTAL_PORT:-3001}:3001"
    volumes:
      - portal-demo:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  portal-demo:
